<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI-Powered Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;
        }

        .chat-container {
            width: 400px;
            max-width: 95%;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .header {
            background: #4169e1;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
        }

        #chatbox {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #fafafa;
        }

        .message {
            margin: 10px 0;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
            text-align: right;
        }

        .bot {
            background: #dcfce7;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        button {
            margin-left: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #4169e1;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3154b3;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <h2> AI-Powered Chatbot</h2>
            <p>Ask me anything!</p>
        </div>

        <div id="chatbox">
            <div class="message bot">
                <b>Bot:</b> Hello! How can I help you?
            </div>
        </div>

        <div class="input-area">

            <input
                type="text"
                id="message"
                placeholder="Type your message..."
                onkeypress="handleKeyPress(event)"
            >

            <button onclick="sendMessage()">Send</button>

        </div>

    </div>


    <script>

        function sendMessage() {

            let input = document.getElementById("message");
            let message = input.value.trim();

            if (message === "") {
                return;
            }

            let chatbox = document.getElementById("chatbox");

            // Display user message
            chatbox.innerHTML += `
                <div class="message user">
                    <b>You:</b> ${message}
                </div>
            `;

            input.value = "";

            // Send message to Flask
            fetch("/chat", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    message: message
                })

            })

            .then(response => response.json())

            .then(data => {

                // Display bot response
                chatbox.innerHTML += `
                    <div class="message bot">
                        <b>Bot:</b> ${data.response}
                    </div>
                `;

                chatbox.scrollTop = chatbox.scrollHeight;

            })

            .catch(error => {

                chatbox.innerHTML += `
                    <div class="message bot">
                        <b>Bot:</b> Sorry, something went wrong.
                    </div>
                `;

                console.error(error);
            });
        }


        function handleKeyPress(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }

    </script>

</body>
</html>
